name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - name: Install
        run: pip install -e ".[test]"
      - name: Test
        run: pytest -q
      - name: Build distribution
        run: |
          pip install --quiet build
          python -m build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: ruff check .

  no-dependencies:
    name: runs with no site-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The core verifier is one stdlib-only file, so that it can be read in full by
      # someone deciding whether to trust it. `python -I -S` runs it with no
      # site-packages and no user site: if a dependency ever creeps in, this fails.
      - name: Verify a bundle with an isolated interpreter
        run: |
          pip install -e .
          python - <<'PY'
          import lcert_verify as L
          cert = L.gate_cert("ci", budget=0.05, safety=1.5, n_photons=100.0,
                             thr=0.30, delta_dose=0.02, loci=[(0.10, 0.11, 0.05)])
          L.make_bundle("ci_bundle", gate_certs=[cert], kpis=[], prereg={"ci": True})
          # The anchor is written out because the standalone verifier abstains
          # without one -- exit 4, not a pass. Running it unanchored here would be
          # asserting the behaviour the tool exists to prevent.
          open("ci_anchor", "w").write(L.bundle_fingerprint("ci_bundle"))
          PY
          python -I -S src/lcert_verify/_verifier.py ci_bundle "$(cat ci_anchor)"
          # and the unanchored run must abstain, not pass: exit 4 exactly
          rc=0
          python -I -S src/lcert_verify/_verifier.py ci_bundle || rc=$?
          test "$rc" -eq 4

  action:
    name: the reusable action passes anchored and fails abstaining
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build a bundle to verify
        id: fixture
        run: |
          pip install -e .
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import lcert_verify as L
          c = L.interval_bound_cert("ci", quantity="q", unit="u", threshold=1.0,
                                    direction="below", loci=[(0.0, 0.5)])
          L.make_bundle("ci_bundle", interval_bound_certs=[c], kpis=[], prereg={"ci": True})
          print("anchor=" + L.bundle_fingerprint("ci_bundle"))
          PY

      - name: Anchored — must pass
        id: anchored
        uses: ./
        with:
          bundle: ci_bundle
          anchor: ${{ steps.fixture.outputs.anchor }}
      - run: |
          test "${{ steps.anchored.outputs.verdict }}" = "VERIFIED"
          test "${{ steps.anchored.outputs.gated-loci }}" = "1"

      - name: Unanchored — must NOT pass
        id: unanchored
        uses: ./
        continue-on-error: true
        with:
          bundle: ci_bundle
      - name: An abstention is a failure, not a green check
        run: |
          test "${{ steps.unanchored.outcome }}" = "failure"
          test "${{ steps.unanchored.outputs.verdict }}" = "UNVERIFIED"

  serve:
    name: the service answers, and abstains with 428
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: pytest -q tests/test_serve.py tests/test_stream.py

  docker:
    name: the image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lcert-verify:ci .
      - name: Serve, and check an abstention is not a 200
        run: |
          set -e
          docker run -d --rm -p 8080:8080 --name lv lcert-verify:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' --data '{}' \
                 http://127.0.0.1:8080/verify)
          test "$code" -ge 400
          docker stop lv
