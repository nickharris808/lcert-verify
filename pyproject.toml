[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcert-verify"
version = "1.0.0"
description = "Zero-trust verifier for LCERT-1 proof-carrying manufacturing certificates — standard library only"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Nicholas Harris" }]
keywords = ["certificate", "verification", "proof-carrying", "semiconductor", "lithography", "eda"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Security :: Cryptography",
    "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
lcert-verify = "lcert_verify.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
